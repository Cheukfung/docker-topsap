services:
  topsap:
    platform: linux/amd64
    build:
      context: .
    restart: "no"
    init: true
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      SERVER_ADDRESS: ${SERVER_ADDRESS:?Set SERVER_ADDRESS}
      USER_NAME: ${USER_NAME:?Set USER_NAME}
      PASSWORD: ${PASSWORD:?Set PASSWORD}
      TUN_MTU: ${TUN_MTU:-1300}
    ports:
      - "${PROXY_BIND_IP:-192.168.0.233}:${HTTP_PORT:-1088}:1082"
      - "${PROXY_BIND_IP:-192.168.0.233}:${SOCKS_PORT:-1089}:1080"
